[package]
name = "wasmvm-component-reference"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
wasmtime = { version = "=48.0.1", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2"] }

wasmtime-wasi-http = { version = "=48.0.1", default-features = false, features = ["p2", "default-send-request"] }

bytes = "=1.12.1"
hyper = { version = "=1.12.0", default-features = false }
http-body-util = "=0.1.5"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }

[features]
error-context = ["wasmtime/component-model-async"]
async-lift = ["wasmtime/component-model-async"]

[[bin]]
name = "error_context"
path = "src/bin/error_context.rs"
required-features = ["error-context"]

[[bin]]
name = "async_lift"
path = "src/bin/async_lift.rs"
required-features = ["async-lift"]
