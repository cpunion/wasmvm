name: LLGo platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      go-version:
        required: true
        type: string
      llgo-revision:
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: ${{ inputs.go-version }}
  LLGO_REVISION: ${{ inputs.llgo-revision }}

jobs:
  llgo-libraries:
    # One union graph per platform, without a final link or test executable.
    # Main pushes warm the cache only; PRs retain every existing semantic job.
    name: Warm LLGo libraries / ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux_llgo.sh
      - name: Set up pinned LLGo
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: ${{ env.LLGO_REVISION }}
          install-method: source
          go-version: ${{ env.GO_VERSION }}
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true
      - name: Verify compiler and locate package cache
        id: cache-path
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$LLGO_REVISION"
          printf 'path=%s\n' "$(llgo env LLGO_PKG_CACHE_DIR)" >> "$GITHUB_OUTPUT"
      - name: Restore shared library objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.cache-path.outputs.path }}
          key: llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-shared-${{ github.sha }}
          restore-keys: |
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-shared-
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-
      - name: Compile reusable libraries without final linking
        run: |
          mkdir -p artifacts/ci
          llgo build -O3 -lto=full -debug-trace artifacts/ci/llgo-libraries.json ./internal/... ./pkg/... testing testing/internal/testdeps
      - name: Preserve frontend and object compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llgo-libraries-${{ inputs.platform }}
          path: artifacts/ci/llgo-libraries.json
          if-no-files-found: warn
          retention-days: 30

  llgo:
    if: github.event_name != 'push'
    needs: llgo-libraries
    name: llgo / ${{ inputs.platform }} / ${{ matrix.shard }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: ["core", "vm", "component", "legacy", "threads", "http", "async", "entry", "p3io"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select semantic shard
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci_shards.py --shard "$SHARD" --github-output "$GITHUB_OUTPUT"
      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux_llgo.sh
      - name: Set up pinned LLGo
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: ${{ env.LLGO_REVISION }}
          install-method: source
          go-version: ${{ env.GO_VERSION }}
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true
      - name: Verify toolchain and locate its package cache
        id: cache-path
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$LLGO_REVISION"
          go version
          llgo version
          printf 'path=%s\n' "$(llgo env LLGO_PKG_CACHE_DIR)" >> "$GITHUB_OUTPUT"
      - name: Restore shared LLGo package objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.cache-path.outputs.path }}
          key: llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-shared-${{ github.sha }}
          restore-keys: |
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-shared-
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-${{ matrix.shard }}-
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-${{ matrix.shard == 'entry' && 'cli' || 'component' }}-
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-
      - name: Prepare this shard's pinned inputs
        env:
          CORPORA: ${{ steps.shard.outputs.inputs }}
        run: |
          read -ra corpora <<< "$CORPORA"
          for corpus in "${corpora[@]}"; do
            python3 "scripts/${corpus}_corpus.py"
          done
      - name: Execute LLGo semantic shard
        working-directory: ${{ steps.shard.outputs.directory }}
        env:
          TEST_PACKAGES: ${{ steps.shard.outputs.packages }}
          SHARD: ${{ matrix.shard }}
          WASMVM_CONFORMANCE_REPORT: ${{ github.workspace }}/artifacts/conformance/core2.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/ci"
          read -ra packages <<< "$TEST_PACKAGES"
          llgo test -O3 -lto=full -json -debug-trace "$GITHUB_WORKSPACE/artifacts/ci/llgo-${SHARD}.json" -count=1 -timeout="${{ steps.shard.outputs.timeout }}" "${packages[@]}"
      - name: Execute native service reference under LLGo
        if: matrix.shard == 'legacy'
        working-directory: benchmarks/service
        run: llgo test -O3 -lto=full -json -debug-trace "$GITHUB_WORKSPACE/artifacts/ci/llgo-service-reference.json" -count=1 -timeout=2m ./...
      - name: Preserve shard execution and timing evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llgo-evidence-${{ inputs.platform }}-${{ matrix.shard }}
          path: |
            artifacts/conformance/
            artifacts/ci/
          if-no-files-found: error
      - name: Preserve core input provenance
        if: always() && matrix.shard == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core2-inputs-llgo-${{ inputs.platform }}
          path: |
            artifacts/core2/evidence.json
            artifacts/core3/evidence.json
          if-no-files-found: error

  llgo-cli:
    if: github.event_name != 'push'
    needs: llgo-libraries
    name: llgo CLI / ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux_llgo.sh
      - name: Set up pinned LLGo
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: ${{ env.LLGO_REVISION }}
          install-method: source
          go-version: ${{ env.GO_VERSION }}
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true
      - name: Verify toolchain and locate its package cache
        id: cache-path
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$LLGO_REVISION"
          go version
          llgo version
          printf 'path=%s\n' "$(llgo env LLGO_PKG_CACHE_DIR)" >> "$GITHUB_OUTPUT"
      - name: Restore shared LLGo package objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.cache-path.outputs.path }}
          key: llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-shared-${{ github.sha }}
          restore-keys: |
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-shared-
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-cli-
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-component-
            llgo-pkg-v1-${{ inputs.platform }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-
      - name: Build and execute the LLGo CLI
        run: |
          mkdir -p artifacts/cli artifacts/ci
          llgo build -O3 -lto=full -debug-trace artifacts/ci/llgo-cli.json -o artifacts/cli/wasmvm ./cmd/wasmvm
          python3 scripts/package_cli.py artifacts/cli/wasmvm --compiler llgo --native available --output artifacts/cli-packages
      - name: Preserve CLI compile and link timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llgo-cli-timings-${{ inputs.platform }}
          path: artifacts/ci/llgo-cli.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve verified LLGo CLI candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-llgo-${{ inputs.platform }}
          path: artifacts/cli-packages/
          if-no-files-found: error
          retention-days: 30

