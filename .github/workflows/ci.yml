name: Go and LLGo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'
  # LLGo memory-hook contribution for xgo-dev/llgo#2918; not a released version.
  LLGO_REVISION: 8b1389c627c77a02e56af03f08d9cdc19edffe77

jobs:
  test:
    name: ${{ matrix.compiler }} / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [go, llgo]
        platform:
          - {name: linux-amd64, runner: ubuntu-24.04}
          - {name: macos-arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: matrix.compiler == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up LLGo
        if: matrix.compiler == 'llgo'
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: ${{ env.LLGO_REVISION }}
          install-method: source
          go-version: ${{ env.GO_VERSION }}
          llvm-version: '22'
          # Candidate engines are pinned in separate evaluation modules.
          cache: false

      - name: Record and verify toolchains
        shell: bash
        env:
          COMPILER: ${{ matrix.compiler }}
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          go version
          if [[ "$COMPILER" == llgo ]]; then
            test "$ACTUAL_LLGO_REVISION" = "$LLGO_REVISION"
            llgo version
            llgo env LLGO_ROOT GOROOT
          fi

      - name: Format and vet
        if: matrix.compiler == 'go'
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Verify complete pinned Core 2.0 inputs
        run: python3 scripts/core2_corpus.py

      - name: Run the same package tests
        shell: bash
        env:
          COMPILER: ${{ matrix.compiler }}
          WASMVM_CONFORMANCE_REPORT: ${{ github.workspace }}/artifacts/conformance/core2.json
        run: |
          if [[ "$COMPILER" == go ]]; then
            CGO_ENABLED=0 go test -count=1 -timeout=10m ./...
          else
            llgo test -count=1 -timeout=10m ./...
          fi

      - name: Check Go data races
        if: matrix.compiler == 'go'
        run: go test -race -count=1 -timeout=10m ./...

      - name: Enforce per-package core coverage
        if: matrix.compiler == 'go'
        shell: bash
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          mkdir -p artifacts/core
          CGO_ENABLED=0 go test -count=1 -timeout=10m -coverprofile=artifacts/core/coverage.out ./internal/... ./pkg/...
          python3 scripts/check_coverage.py artifacts/core/coverage.out --minimum 90 \
            --require github.com/cpunion/wasmvm/internal/binary \
            --require github.com/cpunion/wasmvm/internal/core/decode \
            --require github.com/cpunion/wasmvm/internal/core/validate \
            --require github.com/cpunion/wasmvm/internal/compiler/ir \
            --require github.com/cpunion/wasmvm/internal/compiler/lower \
            --require github.com/cpunion/wasmvm/internal/compiler/slots \
            --require github.com/cpunion/wasmvm/internal/engine/numeric \
            --require github.com/cpunion/wasmvm/internal/engine/simd \
            --require github.com/cpunion/wasmvm/internal/engine/memory \
            --require github.com/cpunion/wasmvm/internal/engine/state \
            --require github.com/cpunion/wasmvm/internal/engine/interp \
            --require github.com/cpunion/wasmvm/pkg/wasm \
            --require github.com/cpunion/wasmvm/pkg/vm

      - name: Fuzz bounded binary inputs
        if: matrix.compiler == 'go'
        run: |
          go test -run '^$' -fuzz '^FuzzReader$' -fuzztime=10s -parallel=2 ./internal/binary
          go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime=10s -parallel=2 ./internal/core/decode
          go test -run '^$' -fuzz '^FuzzValidate$' -fuzztime=10s -parallel=2 ./internal/core/validate
          go test -run '^$' -fuzz '^FuzzLower$' -fuzztime=10s -parallel=2 ./internal/compiler/lower
          go test -run '^$' -fuzz '^FuzzSlots$' -fuzztime=10s -parallel=2 ./internal/compiler/slots
          go test -run '^$' -fuzz '^FuzzNumeric$' -fuzztime=10s -parallel=2 ./internal/engine/numeric
          go test -run '^$' -fuzz '^FuzzPureSIMD$' -fuzztime=10s -parallel=2 ./internal/engine/simd
          go test -run '^$' -fuzz '^FuzzMemoryRanges$' -fuzztime=10s -parallel=2 ./internal/engine/memory
          go test -run '^$' -fuzz '^FuzzExecution$' -fuzztime=10s -parallel=2 ./internal/engine/interp

      - name: Evaluate unchanged wazero and measure harness coverage
        if: matrix.compiler == 'go'
        shell: bash
        run: |
          go -C experiments/wazero vet ./...
          experiments/wazero/scripts/run.sh go upstream -race
          go -C experiments/wazero tool cover -func="$GITHUB_WORKSPACE/artifacts/wazero/go-upstream/coverage.out" | tee artifacts/wazero/go-upstream/coverage-summary.txt
          awk '/^total:/ { found=1; sub(/%$/, "", $3); if ($3+0 < 90) exit 1 } END { if (!found) exit 2 }' artifacts/wazero/go-upstream/coverage-summary.txt

      - name: Check the alternate candidate's Go smoke probes
        if: matrix.compiler == 'go'
        run: go -C experiments/wago test -count=1 -timeout=2m ./...

      - name: Run unchanged wazero with the fixed LLGo runtime
        if: matrix.compiler == 'llgo'
        run: experiments/wazero/scripts/run.sh llgo upstream

      - name: Check benchmark fixtures and harness
        if: matrix.compiler == 'go'
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'

      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wazero-evaluation-${{ matrix.compiler }}-${{ matrix.platform.name }}
          path: artifacts/wazero/
          if-no-files-found: error

      - name: Preserve core coverage
        if: always() && matrix.compiler == 'go'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-coverage-${{ matrix.platform.name }}
          path: artifacts/core/
          if-no-files-found: error

      - name: Preserve actual own-core conformance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core2-execution-${{ matrix.compiler }}-${{ matrix.platform.name }}
          path: artifacts/conformance/core2.json
          if-no-files-found: error

      - name: Preserve corpus provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core2-inputs-${{ matrix.compiler }}-${{ matrix.platform.name }}
          path: artifacts/core2/evidence.json
          if-no-files-found: error
