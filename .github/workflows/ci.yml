name: Go and LLGo

on:
  pull_request:
  workflow_dispatch:
    inputs:
      evaluate_references:
        description: Run independent candidate compatibility evaluations
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'
  LLGO_REVISION: 3571c2523e010e6842c4dd8a5213554fdc72d2a3

jobs:
  plan:
    name: Verify semantic shard coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/ci_shards.py

  go:
    name: go / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux-amd64, runner: ubuntu-24.04}
          - {name: macos-arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify toolchain and prepare pinned inputs
        run: |
          go version
          for corpus in core2 core3 core_extensions preview1 wasi_threads component; do
            python3 "scripts/${corpus}_corpus.py"
          done
      - name: Execute complete Go semantics
        env:
          PLATFORM: ${{ matrix.platform.name }}
          WASMVM_CONFORMANCE_REPORT: ${{ github.workspace }}/artifacts/conformance/core2.json
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go test -count=1 ./internal/platform/native ./internal/engine/nativeexec
          if [[ "$PLATFORM" == linux-amd64 ]]; then
            mkdir -p artifacts/core
            CGO_ENABLED=1 go test -count=1 -timeout=8m -coverpkg=./internal/...,./pkg/... -coverprofile=artifacts/core/coverage.out ./internal/... ./pkg/...
          else
            CGO_ENABLED=1 go test -count=1 -timeout=8m ./...
          fi
      - name: Check native pointer ownership
        if: matrix.platform.name == 'linux-amd64'
        run: GOEXPERIMENT=cgocheck2 go test -count=1 ./internal/platform/native ./internal/engine/nativeexec ./pkg/vm
      - name: Build and execute the Go CLI
        run: |
          mkdir -p artifacts/cli
          CGO_ENABLED=0 go build -o artifacts/cli/wasmvm ./cmd/wasmvm
          python3 scripts/cli_smoke.py artifacts/cli/wasmvm --native unavailable

      - name: Enforce per-package core coverage
        if: matrix.platform.name == 'linux-amd64'
        shell: bash
        run: |
          python3 scripts/check_coverage.py artifacts/core/coverage.out --minimum 90 \
            --require github.com/cpunion/wasmvm/internal/binary \
            --require github.com/cpunion/wasmvm/internal/bench/phase \
            --require github.com/cpunion/wasmvm/internal/cli \
            --require github.com/cpunion/wasmvm/internal/component/canonical \
            --require github.com/cpunion/wasmvm/internal/component/decode \
            --require github.com/cpunion/wasmvm/internal/component/validate \
            --require github.com/cpunion/wasmvm/internal/core/constant \
            --require github.com/cpunion/wasmvm/internal/core/decode \
            --require github.com/cpunion/wasmvm/internal/core/validate \
            --require github.com/cpunion/wasmvm/internal/compiler/ir \
            --require github.com/cpunion/wasmvm/internal/compiler/lower \
            --require github.com/cpunion/wasmvm/internal/compiler/slots \
            --require github.com/cpunion/wasmvm/internal/compiler/nativeabi \
            --require github.com/cpunion/wasmvm/internal/compiler/codegen \
            --require github.com/cpunion/wasmvm/internal/engine/numeric \
            --require github.com/cpunion/wasmvm/internal/engine/simd \
            --require github.com/cpunion/wasmvm/internal/engine/memory \
            --require github.com/cpunion/wasmvm/internal/engine/state \
            --require github.com/cpunion/wasmvm/internal/engine/execute \
            --require github.com/cpunion/wasmvm/internal/engine/nativeexec \
            --require github.com/cpunion/wasmvm/internal/platform/native \
            --require github.com/cpunion/wasmvm/internal/wasi/host \
            --require github.com/cpunion/wasmvm/pkg/wasi/preview1 \
            --require github.com/cpunion/wasmvm/pkg/wasi/preview3 \
            --require github.com/cpunion/wasmvm/pkg/wasi/threads \
            --require github.com/cpunion/wasmvm/pkg/component \
            --require github.com/cpunion/wasmvm/pkg/wasm \
            --require github.com/cpunion/wasmvm/pkg/vm

      - name: Preserve core coverage
        if: always() && matrix.platform.name == 'linux-amd64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-coverage-${{ matrix.platform.name }}
          path: artifacts/core/
          if-no-files-found: error
      - name: Preserve actual own-core conformance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core2-execution-go-${{ matrix.platform.name }}
          path: |
            artifacts/conformance/core2.json*
            artifacts/conformance/core3-*.json
            artifacts/conformance/proposals/*.json
            artifacts/conformance/wasi/*.json
          if-no-files-found: error
      - name: Preserve corpus provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core2-inputs-go-${{ matrix.platform.name }}
          path: |
            artifacts/core2/evidence.json
            artifacts/core3/evidence.json
          if-no-files-found: error

  llgo:
    name: llgo / ${{ matrix.platform.name }} / ${{ matrix.shard }}
    env:
      LLGO_CACHE_GROUP: ${{ matrix.shard }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux-amd64, runner: ubuntu-24.04}
          - {name: macos-arm64, runner: macos-15}
        shard: ["core", "vm", "component", "legacy", "threads", "http", "async", "entry"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select semantic shard
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci_shards.py --shard "$SHARD" --github-output "$GITHUB_OUTPUT"
      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux_llgo.sh
      - name: Set up pinned LLGo
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: ${{ env.LLGO_REVISION }}
          install-method: source
          go-version: ${{ env.GO_VERSION }}
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true
      - name: Verify toolchain and locate its package cache
        id: cache-path
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$LLGO_REVISION"
          go version
          llgo version
          printf 'path=%s\n' "$(llgo env LLGO_PKG_CACHE_DIR)" >> "$GITHUB_OUTPUT"
      - name: Restore LLGo package objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.cache-path.outputs.path }}
          key: llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-${{ env.LLGO_CACHE_GROUP }}-${{ github.sha }}
          restore-keys: |
            llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-${{ env.LLGO_CACHE_GROUP }}-
            llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-${{ matrix.shard == 'entry' && 'cli' || 'component' }}-
            llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-
      - name: Prepare this shard's pinned inputs
        env:
          CORPORA: ${{ steps.shard.outputs.inputs }}
        run: |
          read -ra corpora <<< "$CORPORA"
          for corpus in "${corpora[@]}"; do
            python3 "scripts/${corpus}_corpus.py"
          done
      - name: Execute LLGo semantic shard
        env:
          TEST_PACKAGES: ${{ steps.shard.outputs.packages }}
          SHARD: ${{ matrix.shard }}
          WASMVM_CONFORMANCE_REPORT: ${{ github.workspace }}/artifacts/conformance/core2.json
        run: |
          mkdir -p artifacts/ci
          read -ra packages <<< "$TEST_PACKAGES"
          llgo test -O3 -lto=full -json -debug-trace "artifacts/ci/llgo-${SHARD}.json" -count=1 -timeout=8m "${packages[@]}"
      - name: Preserve shard execution and timing evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llgo-evidence-${{ matrix.platform.name }}-${{ matrix.shard }}
          path: |
            artifacts/conformance/
            artifacts/ci/
          if-no-files-found: error
      - name: Preserve core input provenance
        if: always() && matrix.shard == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core2-inputs-llgo-${{ matrix.platform.name }}
          path: |
            artifacts/core2/evidence.json
            artifacts/core3/evidence.json
          if-no-files-found: error

  llgo-cli:
    name: llgo CLI / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    env:
      LLGO_CACHE_GROUP: cli
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux-amd64, runner: ubuntu-24.04}
          - {name: macos-arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux_llgo.sh
      - name: Set up pinned LLGo
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: ${{ env.LLGO_REVISION }}
          install-method: source
          go-version: ${{ env.GO_VERSION }}
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true
      - name: Verify toolchain and locate its package cache
        id: cache-path
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$LLGO_REVISION"
          go version
          llgo version
          printf 'path=%s\n' "$(llgo env LLGO_PKG_CACHE_DIR)" >> "$GITHUB_OUTPUT"
      - name: Restore LLGo package objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.cache-path.outputs.path }}
          key: llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-${{ env.LLGO_CACHE_GROUP }}-${{ github.sha }}
          restore-keys: |
            llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-${{ env.LLGO_CACHE_GROUP }}-
            llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-component-
            llgo-pkg-v1-${{ matrix.platform.name }}-${{ env.GO_VERSION }}-${{ env.LLGO_REVISION }}-O3-full-
      - name: Build and execute the LLGo CLI
        run: |
          mkdir -p artifacts/cli
          llgo build -O3 -lto=full -o artifacts/cli/wasmvm ./cmd/wasmvm
          python3 scripts/cli_smoke.py artifacts/cli/wasmvm --native available

  race:
    name: Go race / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prepare race/lifecycle inputs
        run: |
          for corpus in core2 core3 core_extensions preview1 wasi_threads component; do
            python3 "scripts/${corpus}_corpus.py"
          done
      - name: Execute unchanged race scope
        run: go test -race -count=1 -timeout=8m -skip 'TestCompleteCore[23]|Test.*(Proposal|Spec)$|TestP1Conformance$|TestOfficialGoGuest$|TestUpstream(P2WorldConsumers|WASIConsumers)$' ./...

  quality:
    name: Go quality / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Format, vet and check CI/benchmark tooling
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Fuzz bounded binary inputs
        run: |
          go test -run '^$' -fuzz '^FuzzReader$' -fuzztime=10s -parallel=2 ./internal/binary
          go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime=10s -parallel=2 ./internal/core/decode
          go test -run '^$' -fuzz '^FuzzValidate$' -fuzztime=10s -parallel=2 ./internal/core/validate
          go test -run '^$' -fuzz '^FuzzLower$' -fuzztime=10s -parallel=2 ./internal/compiler/lower
          go test -run '^$' -fuzz '^FuzzSlots$' -fuzztime=10s -parallel=2 ./internal/compiler/slots
          go test -run '^$' -fuzz '^FuzzNumeric$' -fuzztime=10s -parallel=2 ./internal/engine/numeric
          go test -run '^$' -fuzz '^FuzzPureSIMD$' -fuzztime=10s -parallel=2 ./internal/engine/simd
          go test -run '^$' -fuzz '^FuzzMemoryRanges$' -fuzztime=10s -parallel=2 ./internal/engine/memory
          go test -run '^$' -fuzz '^FuzzExecution$' -fuzztime=10s -parallel=2 ./internal/engine/execute

  references:
    name: Optional reference compatibility
    if: github.event_name == 'workflow_dispatch' && inputs.evaluate_references
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux_llgo.sh
      - uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: ${{ env.LLGO_REVISION }}
          go-version: ${{ env.GO_VERSION }}
          install-method: source
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true
      - run: |
          experiments/wazero/scripts/run.sh go upstream -race
          experiments/wazero/scripts/run.sh llgo upstream
          go -C experiments/wago test -count=1 -timeout=2m ./...
