name: Runtime benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark scope (PR families, sustained gates, or diagnostic survey)
        type: choice
        options: [pr, full, native-simd, survey, routing, p3io, llgo-layout, llgo-poll, llgo-regression, llgo-regression-main]
        default: full
      routing_scope:
        description: Routing groups to measure (routing suite only)
        type: choice
        options: [all, core, memory-simd, gc, threads, applications]
        default: all
      routing_case:
        description: Optional exact case within routing_scope; 20 blocks and Go native controls
        type: string
        default: ''
      baseline:
        description: Baseline commit or ref in this repository
        default: main
        type: string
      reuse_llgo_alignment:
        description: Temporary diagnostic - reuse frozen alignment variants on two new hosts
        type: boolean
        default: false
      llgo_diagnostic_runner:
        description: Temporary native alignment diagnostic runner image
        type: choice
        options: [ubuntu-24.04, ubuntu-22.04]
        default: ubuntu-24.04
      reuse_candidate_run:
        description: Temporary diagnostic - reuse the frozen cancellation candidate build run
        type: string
        default: ''
      candidate_revision:
        description: Temporary diagnostic candidate commit
        type: string
        default: '468e6c286ded60e692c4d10a4aa8b5b71d5931e2'
      extract_regression_ir:
        description: Temporary diagnostic - extract the scalar loop as standalone LLVM IR
        type: boolean
        default: false
      regression_compiler:
        description: Temporary frozen instruction-count diagnostic compiler
        type: choice
        options: [llgo, go]
        default: llgo

permissions:
  contents: read

env:
  BENCHMARK_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'pr' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  p3_reference:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'p3io' }}
    name: Independent P3 HTTP reference / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - run: bash head/scripts/setup_linux_llgo.sh
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore exact Rust dependency/profile cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            p3-rust-target
          key: p3-reference-linux-amd64-rust1.98.0-llvm22-release-${{ hashFiles('head/benchmarks/p3io/rust/Cargo.lock') }}
      - name: Build and actually execute the independent P3 provider
        env:
          CC: /usr/lib/llvm-22/bin/clang
        run: |
          python3 head/benchmarks/p3io/check_reference.py \
            --output-dir "$GITHUB_WORKSPACE/p3-reference-results" \
            --rust-target-dir "$GITHUB_WORKSPACE/p3-rust-target"
      - name: Preserve every build/test outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-reference-validation-linux-amd64
          path: p3-reference-results/
          if-no-files-found: error
          retention-days: 30

  benchmark:
    # Capability completion takes priority; measurements are opt-in until then.
    if: ${{ inputs.suite != 'native-simd' && inputs.suite != 'routing' && inputs.suite != 'p3io' && inputs.suite != 'llgo-layout' && inputs.suite != 'llgo-poll' && inputs.suite != 'llgo-regression' && inputs.suite != 'llgo-regression-main' && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-benchmarks')) }}
    name: Runtime performance / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'pr' && 90 || 10 }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false

      - name: Check out the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || inputs.baseline || 'main' }}
          path: base
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash head/scripts/setup_linux_llgo.sh
      - name: Set up pinned LLGo for own-engine measurements
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true

      - name: Verify the benchmark LLGo identity
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: test "$ACTUAL_LLGO_REVISION" = 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5

      - name: Check benchmark tooling
        run: python3 -m unittest discover -s head/benchmarks -p 'test_*.py'

      - name: Check the Go embedding measurement tool
        shell: bash
        run: |
          mkdir -p benchmark-results
          go -C head/benchmarks/embedded/wazero vet ./...
          go -C head/benchmarks/embedded/wazero test -race -count=1 -timeout=2m -coverprofile="$GITHUB_WORKSPACE/benchmark-results/embedded-coverage.out" ./...
          go -C head/benchmarks/embedded/wazero tool cover -func="$GITHUB_WORKSPACE/benchmark-results/embedded-coverage.out" | tee benchmark-results/embedded-coverage.txt
          awk '/^total:/ { found=1; sub(/%$/, "", $3); if ($3+0 < 90) exit 1 } END { if (!found) exit 2 }' benchmark-results/embedded-coverage.txt

      - name: Install pinned competitors
        shell: bash
        run: |
          python3 head/benchmarks/install_tools.py --sdk --destination "$RUNNER_TEMP/wasm-runtime-tools" --github-env
          mkdir -p benchmark-results
          cp "$RUNNER_TEMP/wasm-runtime-tools/installation.json" benchmark-results/tool-installation.json

      - name: Build and execute independent concurrent SDK references
        run: |
          python3 head/benchmarks/service/check_sdks.py \
            --tools-dir "$RUNNER_TEMP/wasm-runtime-tools" \
            --output-dir "$GITHUB_WORKSPACE/benchmark-results/service-sdk-checks"

      - name: Measure interleaved baseline, candidate, and competitor cases
        if: env.BENCHMARK_SUITE == 'full'
        shell: bash
        run: |
          python3 head/benchmarks/ci.py \
            --base-dir "$GITHUB_WORKSPACE/base" \
            --head-dir "$GITHUB_WORKSPACE/head" \
            --base-sha "$(git -C base rev-parse HEAD)" \
            --head-sha "$(git -C head rev-parse HEAD)" \
            --output-dir "$GITHUB_WORKSPACE/benchmark-results/cli"

      - name: Measure direct API phases and warmed execution
        if: env.BENCHMARK_SUITE != 'survey'
        shell: bash
        env:
          WASMVM_LLGO_REVISION: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
        run: |
          python3 head/benchmarks/phase_ci.py --timeout 180 --suite "$BENCHMARK_SUITE" \
            --base-dir "$GITHUB_WORKSPACE/base" \
            --head-dir "$GITHUB_WORKSPACE/head" \
            --base-sha "$(git -C base rev-parse HEAD)" \
            --head-sha "$(git -C head rev-parse HEAD)" \
            --tools-dir "$RUNNER_TEMP/wasm-runtime-tools" \
            --output-dir "$GITHUB_WORKSPACE/benchmark-results/phases"

      - name: Survey the complete Core portfolio and GC / Threads
        if: env.BENCHMARK_SUITE == 'survey'
        env:
          WASMVM_LLGO_REVISION: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
        run: |
          python3 head/benchmarks/survey.py \
            --output "$GITHUB_WORKSPACE/benchmark-results/phases" \
            --build-dir "$RUNNER_TEMP/wasmvm-survey-build" \
            --wasmtime-sdk "$RUNNER_TEMP/wasm-runtime-tools/wasmtime-c-api/wasmtime-v48.0.1-x86_64-linux-c-api" \
            --wasmer-sdk "$RUNNER_TEMP/wasm-runtime-tools/wasmer" \
            --wasmedge-sdk "$RUNNER_TEMP/wasm-runtime-tools/wasmedge"
          python3 head/benchmarks/survey_modern.py \
            --core-output "$GITHUB_WORKSPACE/benchmark-results/phases"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          mkdir -p benchmark-results
          {
            if [[ -f benchmark-results/phases/report.md ]]; then
              cat benchmark-results/phases/report.md
            else
              printf 'Phase measurements are unavailable because setup or execution failed. See the job logs.\n'
            fi
            printf '\n---\n\n'
            if [[ -f benchmark-results/cli/report.md ]]; then
              cat benchmark-results/cli/report.md
            else
              printf 'The legacy reference and owned production CLI series run only in full mode. API phase timings are above.\n'
            fi
          } > benchmark-results/report.md
          cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve measurements and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-benchmark-comparison
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30

  native_arm64:
    # Sustained native acceptance is explicit; ordinary PR phase comparisons
    # already include both owned backends and all compiled references.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'native-simd') }}
    name: Native feature and competitors / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.suite == 'native-simd' && '[{"name":"linux-amd64","runner":"ubuntu-24.04","artifact":"native-amd64-comparison"},{"name":"macos-arm64","runner":"macos-15","artifact":"native-arm64-comparison"}]' || '[{"name":"macos-arm64","runner":"macos-15","artifact":"native-arm64-comparison"}]') }}
    timeout-minutes: 30
    env:
      WASMVM_LLGO_REVISION: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline || 'main' }}
          path: base
          persist-credentials: false
      - name: Install Linux LLVM dependencies
        if: runner.os == 'Linux'
        run: bash head/scripts/setup_linux_llgo.sh
      - uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        id: llgo
        with:
          llgo-version: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          install-dependencies: ${{ runner.os != 'Linux' }}
          cache: true
      - name: Verify the compiler and install only the native reference SDKs
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$WASMVM_LLGO_REVISION"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          target = '${{ matrix.platform.name }}'.replace('macos-', 'darwin-')
          source = Path('head/benchmarks/tools-' + target + '.json')
          manifest = json.loads(source.read_text())
          manifest['tools'] = [t for t in manifest['tools'] if t['id'] == 'wasmer']
          manifest['sdks'] = [t for t in manifest['sdks'] if t['id'] in ('wasmer', 'wasmtime-c-api')]
          manifest['sourceManifestSha256'] = hashlib.sha256(source.read_bytes()).hexdigest()
          (Path(os.environ['RUNNER_TEMP']) / 'native-tools.json').write_text(json.dumps(manifest))
          PY
          python3 head/benchmarks/install_tools.py --sdk \
            --manifest "$RUNNER_TEMP/native-tools.json" \
            --destination "$RUNNER_TEMP/native-tools"
      - name: Compare the native feature without repeating semantic or CLI suites
        run: |
          python3 head/benchmarks/native_ci.py \
            --base-dir "$GITHUB_WORKSPACE/base" --head-dir "$GITHUB_WORKSPACE/head" \
            --scope "${{ inputs.suite == 'native-simd' && 'fixed-simd' || 'integer' }}" \
            --tools-dir "$RUNNER_TEMP/native-tools" --output-dir "$GITHUB_WORKSPACE/native-results"
      - name: Publish native report
        if: always()
        run: |
          mkdir -p native-results
          if [[ ! -f native-results/report.md ]]; then
            echo 'macOS native comparison unavailable; setup failed. Merging remains blocked.' > native-results/report.md
          fi
          cat native-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.platform.artifact }}
          path: native-results/
          if-no-files-found: error
          retention-days: 30

  routing_build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'routing' }}
    name: Build routing comparison once / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WASMVM_LLGO_REVISION: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline }}
          path: base
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - run: bash head/scripts/setup_linux_llgo.sh
      - uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        id: llgo
        with:
          llgo-version: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          install-dependencies: false
          cache: true
      - name: Verify compiler and comparison tooling
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$WASMVM_LLGO_REVISION"
          python3 -m unittest discover -s head/benchmarks -p test_routing_compare.py
      - name: Install pinned reference SDKs once
        run: |
          python3 head/benchmarks/install_tools.py --sdk \
            --destination "$GITHUB_WORKSPACE/routing-build/tools" --github-env
      - name: Build and execute independent concurrent SDK references
        run: |
          python3 head/benchmarks/service/check_sdks.py \
            --tools-dir "$GITHUB_WORKSPACE/routing-build/tools" \
            --output-dir "$GITHUB_WORKSPACE/routing-build/service-sdk-checks"
      - name: Build exact base/head and reference binaries
        shell: bash
        run: |
          set -o pipefail
          python3 -u head/benchmarks/routing_compare.py build \
            --head-dir "$GITHUB_WORKSPACE/head" --base-dir "$GITHUB_WORKSPACE/base" \
            --tools-dir "$GITHUB_WORKSPACE/routing-build/tools" \
            --output-dir "$GITHUB_WORKSPACE/routing-build" 2>&1 | tee routing-build/build.log
      - name: Preserve build inputs, binaries and libraries with executable modes
        if: always()
        run: |
          mkdir -p routing-build
          tar -czf routing-build.tar.gz routing-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: routing-build-linux-amd64
          path: routing-build.tar.gz
          if-no-files-found: error
          retention-days: 14

  routing_measure:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'routing' }}
    needs: routing_build
    name: Routing comparison / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Each group has an independent runner and source-pinned A/A controls.
      max-parallel: 5
      matrix:
        group: ${{ fromJSON(inputs.routing_scope == 'all' && '["core","memory-simd","gc","threads","applications","threads-sustained"]' || inputs.routing_scope == 'threads' && '["threads","threads-sustained"]' || format('["{0}"]', inputs.routing_scope)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: routing-build-linux-amd64
      - name: Restore executable artifacts and reference library paths
        run: |
          tar -xzf routing-build.tar.gz
          python3 - <<'PY'
          import os
          from pathlib import Path
          directories = [str(Path('routing-build/host-libraries').resolve())]
          directories += sorted({str(p.parent.resolve()) for p in Path('routing-build/tools').rglob('*.so*') if p.is_file()})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('LD_LIBRARY_PATH=' + ':'.join(directories) + '\n')
          PY
      - name: Measure only this group on one inherited CPU
        env:
          ROUTING_CASE: ${{ inputs.routing_case }}
        run: |
          routing_group="${{ matrix.group }}"
          routing_flags=()
          if [[ -n "$ROUTING_CASE" ]]; then
            routing_flags+=(--case "$ROUTING_CASE" --blocks 20)
          fi
          if [[ "$routing_group" == threads-sustained ]]; then
            routing_group=threads
            routing_flags+=(--threads-sustained)
          fi
          python3 -u head/benchmarks/routing_compare.py measure \
            --head-dir "$GITHUB_WORKSPACE/head" --build-dir "$GITHUB_WORKSPACE/routing-build" \
            --group "$routing_group" "${routing_flags[@]}" --output-dir "$GITHUB_WORKSPACE/routing-results"
      - name: Measure the separately declared sustained GC cohort
        if: matrix.group == 'gc'
        run: |
          python3 -u head/benchmarks/routing_compare.py measure \
            --head-dir "$GITHUB_WORKSPACE/head" --build-dir "$GITHUB_WORKSPACE/routing-build" \
            --group gc --gc-sustained --output-dir "$GITHUB_WORKSPACE/routing-results/sustained"
      - name: Publish the complete group result
        if: always()
        run: |
          mkdir -p routing-results
          if [[ -f routing-results/report.md ]]; then
            cat routing-results/report.md >> "$GITHUB_STEP_SUMMARY"
            if [[ -f routing-results/sustained/report.md ]]; then
              printf '\nSeparate sustained GC cohort:\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat routing-results/sustained/report.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Routing measurement unavailable; setup or execution failed. No performance acceptance.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: routing-comparison-${{ matrix.group }}
          path: routing-results/
          if-no-files-found: error
          retention-days: 30

  comment:
    name: Report benchmark comparison on PR
    needs: [benchmark, native_arm64]
    if: ${{ always() && !cancelled() && (needs.benchmark.result != 'skipped' || needs.native_arm64.result != 'skipped') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download the report when measurements completed
        if: needs.benchmark.result == 'success' || needs.benchmark.result == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-benchmark-comparison
          path: benchmark-results

      - name: Download the macOS feature report
        if: needs.native_arm64.result == 'success' || needs.native_arm64.result == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-arm64-comparison
          path: native-results

      # This job never checks out or executes candidate code. Reports are data.
      # Fork PRs keep read-only credentials and publish summaries/artifacts only.
      - name: Create or update the benchmark comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- wasmvm-runtime-benchmark -->';
            const number = context.issue.number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.head.sha !== process.env.EXPECTED_HEAD || pr.base.sha !== process.env.EXPECTED_BASE) {
              core.notice('The PR head or base changed; keep the newer benchmark comment.');
              return;
            }
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report;
            if (fs.existsSync('benchmark-results/report.md')) {
              const path = 'benchmark-results/report.md';
              if (fs.statSync(path).size > 50000) throw new Error('Benchmark report exceeds comment size limit');
              report = fs.readFileSync(path, 'utf8');
            } else {
              report = `Benchmark job **${process.env.BENCHMARK_RESULT}** for \`${process.env.EXPECTED_HEAD}\`. No valid performance comparison is available.`;
            }
            if (fs.existsSync('native-results/report.md')) {
              const nativeReport = fs.readFileSync('native-results/report.md', 'utf8');
              if (nativeReport.length > 10000) throw new Error('Native report exceeds comment limit');
              report += `\n\n${nativeReport}`;
            }
            const body = `${marker}\n${report}\n\n[CI run and raw measurement artifact](${runURL})`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: number, per_page: 100});
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: number, body});
            }

  llgo_layout_build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'llgo-layout' && !inputs.reuse_llgo_alignment }}
    name: Relink LLGo layout / ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        role: [base, head]
    env:
      WASMVM_LLGO_REVISION: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - run: bash control/scripts/setup_linux_llgo.sh
      - uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          install-dependencies: false
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: routing-build-linux-amd64
          run-id: 43448812030
          github-token: ${{ github.token }}
      - run: tar -xzf routing-build.tar.gz
      - name: Relink only the three predeclared LLGo variants
        run: python3 -u control/benchmarks/llgo_layout_diagnostic.py build --role '${{ matrix.role }}' --build-dir routing-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llgo-layout-${{ matrix.role }}
          path: |
            llgo-layout-${{ matrix.role }}.tar.gz
            routing-build/layout-probe-${{ matrix.role }}/
          if-no-files-found: warn
          retention-days: 14

  llgo_layout_measure:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && ((inputs.suite == 'llgo-layout' && (inputs.reuse_llgo_alignment || needs.llgo_layout_build.result == 'success')) || (inputs.suite == 'llgo-poll' && (inputs.reuse_candidate_run != '' || needs.llgo_poll_build.result == 'success'))) }}
    name: Portable dispatch causal comparison / ${{ matrix.cohort }}
    needs: [llgo_layout_build, llgo_poll_build]
    runs-on: ${{ matrix.cohort == 'poll-ubuntu22' && 'ubuntu-22.04' || inputs.llgo_diagnostic_runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      OPERAND_ABLATION: ${{ inputs.suite == 'llgo-poll' }}
      ROUTING_CASE: ${{ inputs.routing_case || 'memory/dependent-address' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        cohort: ${{ fromJSON(inputs.suite == 'llgo-poll' && (inputs.reuse_candidate_run != '' && '["confirm-1","confirm-2"]' || '["poll-ubuntu24","poll-ubuntu22"]') || inputs.reuse_llgo_alignment && '["repeat-1","repeat-2"]' || '["primary"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OPERAND_ABLATION == 'true' && inputs.candidate_revision || '95943842febc2d3571547c72f2d62bc79f232f88' }}
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: routing-build-linux-amd64
          run-id: 43448812030
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.suite == 'llgo-poll' && 'poll-*' || 'llgo-layout-[bh]*' }}
          run-id: ${{ inputs.suite == 'llgo-poll' && inputs.reuse_candidate_run || inputs.suite != 'llgo-poll' && inputs.reuse_llgo_alignment && '43520701499' || github.run_id }}
          github-token: ${{ github.token }}
          path: derived
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.suite == 'llgo-poll'
        with:
          pattern: poll-*
          run-id: 43537347012
          github-token: ${{ github.token }}
          path: prior-derived
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: env.OPERAND_ABLATION == 'true'
        with:
          pattern: poll-*
          run-id: 43561639936
          github-token: ${{ github.token }}
          path: ablation-derived
          merge-multiple: true
      - name: Restore frozen defaults, derived variants and library paths
        run: |
          tar -xzf routing-build.tar.gz
          if [[ '${{ inputs.suite }}' == llgo-poll ]]; then
            tar -xzf derived/poll-go.tar.gz
            tar -xzf derived/poll-llgo.tar.gz
            mkdir prior
            tar -xzf prior-derived/poll-go.tar.gz -C prior
            tar -xzf prior-derived/poll-llgo.tar.gz -C prior
            python3 control/benchmarks/llgo_layout_diagnostic.py merge-poll --build-dir routing-build --prior-dir prior/routing-build
            if [[ "$OPERAND_ABLATION" == true ]]; then
              mkdir ablation
              tar -xzf ablation-derived/poll-go.tar.gz -C ablation
              tar -xzf ablation-derived/poll-llgo.tar.gz -C ablation
              python3 control/benchmarks/llgo_layout_diagnostic.py operand-ablation --build-dir routing-build --ablation-dir ablation/routing-build
            fi
          else
            tar -xzf derived/llgo-layout-base.tar.gz
            tar -xzf derived/llgo-layout-head.tar.gz
            python3 control/benchmarks/llgo_layout_diagnostic.py merge --build-dir routing-build
          fi
          python3 - <<'PYLIB'
          import os
          from pathlib import Path
          directories = [str(Path('routing-build/host-libraries').resolve())]
          directories += sorted({str(p.parent.resolve()) for p in Path('routing-build/tools').rglob('*.so*') if p.is_file()})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('LD_LIBRARY_PATH=' + ':'.join(directories) + '\n')
          PYLIB
      - name: Extract compatible user-space libraries; measurements remain native host processes
        if: inputs.llgo_diagnostic_runner == 'ubuntu-22.04' || matrix.cohort == 'poll-ubuntu22'
        env:
          NATIVE_RUNTIME_IMAGE: ubuntu@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
        run: |
          mkdir -p llgo-layout-results/native-runtime
          runtime_container=$(docker create --platform linux/amd64 "$NATIVE_RUNTIME_IMAGE" true)
          trap 'docker rm "$runtime_container"' EXIT
          for library in libc.so.6 libm.so.6 ld-linux-x86-64.so.2; do
            docker cp -L "$runtime_container:/lib/x86_64-linux-gnu/$library" "llgo-layout-results/native-runtime/$library"
          done
          python3 - <<'PYRUNTIME'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('llgo-layout-results/native-runtime').resolve()
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in folder.iterdir()}
          prefix = [str(folder / 'ld-linux-x86-64.so.2'), '--library-path', str(folder) + ':' + os.environ['LD_LIBRARY_PATH']]
          path = Path('routing-build/build.json')
          data = json.loads(path.read_text())
          for runtime in data['runtimes'].values():
              runtime['command'] = prefix + runtime['command']
          data['nativeRuntime'] = {'image': os.environ['NATIVE_RUNTIME_IMAGE'], 'libraryHashes': hashes, 'prefix': prefix,
              'scope': 'Native host processes, not container timing; Docker only extracts immutable library files.'}
          path.write_text(json.dumps(data, indent=2) + '\n')
          PYRUNTIME
      - name: Fixed 20 blocks; all variants, references and A/A controls
        run: |
          python3 -u control/benchmarks/routing_compare.py measure \
            --head-dir "$GITHUB_WORKSPACE/head" --build-dir "$GITHUB_WORKSPACE/routing-build" \
            --group memory-simd --case "$ROUTING_CASE" --blocks 20 \
            --output-dir "$GITHUB_WORKSPACE/llgo-layout-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llgo-layout-results-${{ matrix.cohort }}
          path: llgo-layout-results/
          if-no-files-found: error
          retention-days: 30

  llgo_poll_build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'llgo-poll' && inputs.reuse_candidate_run == '' }}
    name: Build portable dispatch candidate / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [go, llgo]
    env:
      WASMVM_LLGO_REVISION: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_revision }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - run: bash control/scripts/setup_linux_llgo.sh
      - uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          install-dependencies: false
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: routing-build-linux-amd64
          run-id: 43448812030
          github-token: ${{ github.token }}
      - run: tar -xzf routing-build.tar.gz
      - name: Build only the candidate with this compiler
        run: python3 -u control/benchmarks/llgo_layout_diagnostic.py build-poll --candidate-dir candidate --compiler '${{ matrix.compiler }}' --build-dir routing-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: poll-${{ matrix.compiler }}
          path: poll-${{ matrix.compiler }}.tar.gz
          if-no-files-found: warn
          retention-days: 14

  llgo_regression_profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'llgo-regression' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REGRESSION_CANDIDATE_RUN: ${{ inputs.reuse_candidate_run }}
      REGRESSION_CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      REGRESSION_COMPILER: ${{ inputs.regression_compiler }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 95943842febc2d3571547c72f2d62bc79f232f88
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: routing-build-linux-amd64
          run-id: 43448812030
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: poll-${{ inputs.regression_compiler || 'llgo' }}
          run-id: 43537347012
          github-token: ${{ github.token }}
          path: downloads/counter
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.reuse_candidate_run == '' && inputs.regression_compiler != 'go'
        with:
          name: poll-llgo
          run-id: 43543803052
          github-token: ${{ github.token }}
          path: downloads/dense
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.regression_compiler != 'go'
        with:
          name: poll-llgo
          run-id: 43545680097
          github-token: ${{ github.token }}
          path: downloads/scalar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.regression_compiler == 'go'
        with:
          name: poll-go
          run-id: 43552275491
          github-token: ${{ github.token }}
          path: downloads/opcode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.reuse_candidate_run != ''
        with:
          name: poll-${{ inputs.regression_compiler || 'llgo' }}
          run-id: ${{ inputs.reuse_candidate_run }}
          github-token: ${{ github.token }}
          path: downloads/candidate
      - name: Install instruction-count tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          dpkg-query -W valgrind libc6
      - name: Count frozen portable loops; instrumented timings are not used
        run: python3 -u control/benchmarks/llgo_regression_profile.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llgo-regression-profile
          path: regression-profile/
          if-no-files-found: error
          retention-days: 30

  llgo_main_regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'llgo-regression-main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WASMVM_LLGO_REVISION: e6a873288f0c70b5c3c4fd46f708a5b079651f93
      REGRESSION_EXTRACT_IR: ${{ inputs.extract_regression_ir }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 95943842febc2d3571547c72f2d62bc79f232f88
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: poll-llgo
          run-id: 43537347012
          github-token: ${{ github.token }}
          path: downloads/counter
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: poll-llgo
          run-id: 43543803052
          github-token: ${{ github.token }}
          path: downloads/dense
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: poll-llgo
          run-id: 43545680097
          github-token: ${{ github.token }}
          path: downloads/scalar
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - run: bash control/scripts/setup_linux_llgo.sh
      - uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: e6a873288f0c70b5c3c4fd46f708a5b079651f93
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          install-dependencies: false
          cache: true
      - name: Verify current compiler on three frozen sources
        run: python3 -u control/benchmarks/llgo_main_regression.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llgo-main-regression
          path: main-regression/
          if-no-files-found: error
          retention-days: 30
