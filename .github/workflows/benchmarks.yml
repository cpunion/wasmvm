name: Runtime benchmarks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark scope (PR families or full sustained runs)
        type: choice
        options: [pr, full, native-simd]
        default: full
      baseline:
        description: Baseline commit or ref in this repository
        default: main
        type: string

permissions:
  contents: read

env:
  BENCHMARK_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'pr' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: ${{ inputs.suite != 'native-simd' }}
    name: Base, head, and competitors / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false

      - name: Check out the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || inputs.baseline || 'main' }}
          path: base
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Set up pinned LLGo for own-engine measurements
        id: llgo
        uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        with:
          llgo-version: 8b1389c627c77a02e56af03f08d9cdc19edffe77
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          cache: true

      - name: Verify the benchmark LLGo identity
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: test "$ACTUAL_LLGO_REVISION" = 8b1389c627c77a02e56af03f08d9cdc19edffe77

      - name: Check benchmark tooling
        run: python3 -m unittest discover -s head/benchmarks -p 'test_*.py'

      - name: Check the Go embedding measurement tool
        shell: bash
        run: |
          mkdir -p benchmark-results
          go -C head/benchmarks/embedded/wazero vet ./...
          go -C head/benchmarks/embedded/wazero test -race -count=1 -timeout=2m -coverprofile="$GITHUB_WORKSPACE/benchmark-results/embedded-coverage.out" ./...
          go -C head/benchmarks/embedded/wazero tool cover -func="$GITHUB_WORKSPACE/benchmark-results/embedded-coverage.out" | tee benchmark-results/embedded-coverage.txt
          awk '/^total:/ { found=1; sub(/%$/, "", $3); if ($3+0 < 90) exit 1 } END { if (!found) exit 2 }' benchmark-results/embedded-coverage.txt

      - name: Install pinned competitors
        shell: bash
        run: |
          python3 head/benchmarks/install_tools.py --sdk --destination "$RUNNER_TEMP/wasm-runtime-tools" --github-env
          mkdir -p benchmark-results
          cp "$RUNNER_TEMP/wasm-runtime-tools/installation.json" benchmark-results/tool-installation.json

      - name: Measure interleaved baseline, candidate, and competitor cases
        if: env.BENCHMARK_SUITE == 'full'
        shell: bash
        run: |
          python3 head/benchmarks/ci.py \
            --base-dir "$GITHUB_WORKSPACE/base" \
            --head-dir "$GITHUB_WORKSPACE/head" \
            --base-sha "$(git -C base rev-parse HEAD)" \
            --head-sha "$(git -C head rev-parse HEAD)" \
            --output-dir "$GITHUB_WORKSPACE/benchmark-results/cli"

      - name: Measure direct API phases and warmed execution
        shell: bash
        env:
          WASMVM_LLGO_REVISION: 8b1389c627c77a02e56af03f08d9cdc19edffe77
        run: |
          python3 head/benchmarks/phase_ci.py --timeout 180 --suite "$BENCHMARK_SUITE" \
            --base-dir "$GITHUB_WORKSPACE/base" \
            --head-dir "$GITHUB_WORKSPACE/head" \
            --base-sha "$(git -C base rev-parse HEAD)" \
            --head-sha "$(git -C head rev-parse HEAD)" \
            --tools-dir "$RUNNER_TEMP/wasm-runtime-tools" \
            --output-dir "$GITHUB_WORKSPACE/benchmark-results/phases"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          mkdir -p benchmark-results
          {
            if [[ -f benchmark-results/phases/report.md ]]; then
              cat benchmark-results/phases/report.md
            else
              printf 'Phase measurements are unavailable because setup or execution failed. See the job logs.\n'
            fi
            printf '\n---\n\n'
            if [[ -f benchmark-results/cli/report.md ]]; then
              cat benchmark-results/cli/report.md
            else
              printf 'The legacy reference CLI series runs only in full mode. Owned CLI timings are in the phase report.\n'
            fi
          } > benchmark-results/report.md
          cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve measurements and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-benchmark-comparison
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30

  native_arm64:
    name: Native feature and competitors / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.suite == 'native-simd' && '[{"name":"linux-amd64","runner":"ubuntu-24.04","artifact":"native-amd64-comparison"},{"name":"macos-arm64","runner":"macos-15","artifact":"native-arm64-comparison"}]' || '[{"name":"macos-arm64","runner":"macos-15","artifact":"native-arm64-comparison"}]') }}
    timeout-minutes: 30
    env:
      WASMVM_LLGO_REVISION: 8b1389c627c77a02e56af03f08d9cdc19edffe77
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline || 'main' }}
          path: base
          persist-credentials: false
      - uses: xgo-dev/setup-llgo@4b2f2c9aed3fd28f139615fe636dee5e2ce5bc91
        id: llgo
        with:
          llgo-version: 8b1389c627c77a02e56af03f08d9cdc19edffe77
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          cache: true
      - name: Verify the compiler and install only the native reference SDKs
        env:
          ACTUAL_LLGO_REVISION: ${{ steps.llgo.outputs.llgo-revision }}
        run: |
          test "$ACTUAL_LLGO_REVISION" = "$WASMVM_LLGO_REVISION"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          target = '${{ matrix.platform.name }}'.replace('macos-', 'darwin-')
          source = Path('head/benchmarks/tools-' + target + '.json')
          manifest = json.loads(source.read_text())
          manifest['tools'] = [t for t in manifest['tools'] if t['id'] == 'wasmer']
          manifest['sdks'] = [t for t in manifest['sdks'] if t['id'] in ('wasmer', 'wasmtime-c-api')]
          manifest['sourceManifestSha256'] = hashlib.sha256(source.read_bytes()).hexdigest()
          (Path(os.environ['RUNNER_TEMP']) / 'native-tools.json').write_text(json.dumps(manifest))
          PY
          python3 head/benchmarks/install_tools.py --sdk \
            --manifest "$RUNNER_TEMP/native-tools.json" \
            --destination "$RUNNER_TEMP/native-tools"
      - name: Compare the native feature without repeating semantic or CLI suites
        run: |
          python3 head/benchmarks/native_ci.py \
            --base-dir "$GITHUB_WORKSPACE/base" --head-dir "$GITHUB_WORKSPACE/head" \
            --scope "${{ inputs.suite == 'native-simd' && 'fixed-simd' || 'integer' }}" \
            --tools-dir "$RUNNER_TEMP/native-tools" --output-dir "$GITHUB_WORKSPACE/native-results"
      - name: Publish native report
        if: always()
        run: |
          mkdir -p native-results
          if [[ ! -f native-results/report.md ]]; then
            echo 'macOS native comparison unavailable; setup failed. Merging remains blocked.' > native-results/report.md
          fi
          cat native-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.platform.artifact }}
          path: native-results/
          if-no-files-found: error
          retention-days: 30

  comment:
    name: Report benchmark comparison on PR
    needs: [benchmark, native_arm64]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download the report when measurements completed
        if: needs.benchmark.result == 'success' || needs.benchmark.result == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-benchmark-comparison
          path: benchmark-results

      - name: Download the macOS feature report
        if: needs.native_arm64.result == 'success' || needs.native_arm64.result == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-arm64-comparison
          path: native-results

      # This job never checks out or executes candidate code. Reports are data.
      # Fork PRs keep read-only credentials and publish summaries/artifacts only.
      - name: Create or update the benchmark comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- wasmvm-runtime-benchmark -->';
            const number = context.issue.number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.head.sha !== process.env.EXPECTED_HEAD || pr.base.sha !== process.env.EXPECTED_BASE) {
              core.notice('The PR head or base changed; keep the newer benchmark comment.');
              return;
            }
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report;
            if (fs.existsSync('benchmark-results/report.md')) {
              const path = 'benchmark-results/report.md';
              if (fs.statSync(path).size > 50000) throw new Error('Benchmark report exceeds comment size limit');
              report = fs.readFileSync(path, 'utf8');
            } else {
              report = `Benchmark job **${process.env.BENCHMARK_RESULT}** for \`${process.env.EXPECTED_HEAD}\`. No valid performance comparison is available.`;
            }
            if (fs.existsSync('native-results/report.md')) {
              const nativeReport = fs.readFileSync('native-results/report.md', 'utf8');
              if (nativeReport.length > 10000) throw new Error('Native report exceeds comment limit');
              report += `\n\n${nativeReport}`;
            }
            const body = `${marker}\n${report}\n\n[CI run and raw measurement artifact](${runURL})`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: number, per_page: 100});
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: number, body});
            }
