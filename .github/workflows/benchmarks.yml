          retention-days: 30

  llgo_weak_diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'llgo-weak' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            revision: 5860fb6f9c13371f6cdb456a987a8e95844066d4
          - label: head
            revision: 9fc2aa731fc578f883158c672a84dacda60e3252
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cpunion/llgo
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-binaryen
      - run: bash dev/install_wasmer.sh
      - name: Compile the exact failing weak suite
        run: |
          mkdir weak-diagnostic
          go build -o "$RUNNER_TEMP/weak-llgo" ./cmd/llgo
          "$RUNNER_TEMP/weak-llgo" test -c -target wasi -o "$GITHUB_WORKSPACE/weak-diagnostic/weak.wasm" ./test/std/weak
          "$RUNNER_TEMP/weak-llgo" test -c -target wasi -o "$GITHUB_WORKSPACE/weak-diagnostic/sync.wasm" ./test/std/sync
      - name: Repeat under the pinned CI Wasmer and emulator flags
        working-directory: test/std/weak
        run: |
          python3 -u - <<'PYTHON'
          import os,json,subprocess,pathlib,shutil,hashlib,tempfile
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out=root/'weak-diagnostic'
          wasm=out/'weak.wasm'
          cli=shutil.which('wasmer')
          result={'revision':subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip(),'wasmer':subprocess.check_output([cli,'--version'],text=True),'wasmSha256':hashlib.sha256(wasm.read_bytes()).hexdigest(),'processes':[]}
          for i in range(60):
              package='weak'if i<30 else 'sync'
              os.chdir(root/'test'/'std'/package)
              wasm=out/(package+'.wasm')
              cmd=[cli,'run','--enable-exceptions','--enable-simd','--stack-size=1048576','--volume='+str(pathlib.Path.cwd()),'--volume='+tempfile.gettempdir(),'--env=PWD='+str(pathlib.Path.cwd()),str(wasm),'--','-test.v','-test.count=1']+(['-test.run=^TestCondStateReclamation$']if package=='sync'else[])
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=30,env=dict(os.environ,RUST_LOG='off'))
              result['processes'].append({'index':i,'package':package,'command':cmd,'exit':p.returncode,'stdout':p.stdout,'stderr':p.stderr})
              (out/'results.json').write_text(json.dumps(result,indent=2)+'\n')
              print(i,'exit',p.returncode,flush=True)
          assert all(p['exit']==0 and 'PASS' in p['stdout']for p in result['processes'])
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llgo-weak-${{ matrix.label }}
          path: weak-diagnostic/
          if-no-files-found: error
          retention-days: 30

  llgo_msvc_simd_diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'llgo-msvc-simd' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            revision: 5860fb6f9c13371f6cdb456a987a8e95844066d4
          - label: head
            revision: 0fead5513f951c3302dd3524d3560afb3de9ae66
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      LLGO_ROOT: ${{ github.workspace }}
      GOEXPERIMENT: simd
      GOAMD64: v1
      GODEBUG: cpu.avx512f=off
      DIAG_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cpunion/llgo
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
          windows-abi: msvc
          windows-arch: amd64
          windows-msvc-dependencies: runtime
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: llgo-msvc-simd-${{ matrix.label }}
          run-id: 43803237857
          github-token: ${{ github.token }}
          path: simd-diagnostic
      - uses: ./.github/actions/setup-go
        if: matrix.label == 'head'
      - name: Build candidate and check caller allocation regression
        if: matrix.label == 'head'
        shell: python
        run: |
          import os,pathlib,subprocess
          out=pathlib.Path('simd-diagnostic').resolve()
          cli=pathlib.Path(os.environ['RUNNER_TEMP'])/'unwind-llgo.exe'
          subprocess.run(['go','build','-o',str(cli),'./cmd/llgo'],check=True)
          subprocess.run([str(cli),'test','-O2','-c','-o',str(out/'upstream.exe'),'simd/archsimd/internal/simd_test'],check=True)
          subprocess.run([str(cli),'test','-O2','-v','-run','^TestRuntimeCallersWindowsAllocations$','-count=1','./test/go'],check=True,timeout=240)
      - name: Bound execution and capture stalled native stacks
        shell: python
        run: |
          import os,json,pathlib,subprocess,shutil,time,ctypes,hashlib,sys
          from ctypes import wintypes
          out=pathlib.Path('simd-diagnostic').resolve()
          binary=out/'upstream.exe'
          class Memory(ctypes.Structure):
              _fields_=[('cb',wintypes.DWORD),('faults',wintypes.DWORD)]+[(name,ctypes.c_size_t)for name in ['peakWS','workingSet','peakPaged','paged','peakNonPaged','nonPaged','pagefile','peakPagefile','private']]
          psapi=ctypes.WinDLL('psapi')
          psapi.GetProcessMemoryInfo.argtypes=[wintypes.HANDLE,ctypes.c_void_p,wintypes.DWORD]
          kernel=ctypes.WinDLL('kernel32')
          kernel.GetProcessTimes.argtypes=[wintypes.HANDLE]+[ctypes.POINTER(wintypes.FILETIME)]*4
          def sample(p):
              m=Memory();m.cb=ctypes.sizeof(m)
              ok=psapi.GetProcessMemoryInfo(wintypes.HANDLE(int(p._handle)),ctypes.byref(m),m.cb)
              times=[wintypes.FILETIME()for _ in range(4)]
              kernel.GetProcessTimes(wintypes.HANDLE(int(p._handle)),*(ctypes.byref(t)for t in times))
              return {'privateBytes':m.private,'workingSetBytes':m.workingSet,'memoryOK':bool(ok),'cpuMs':sum((t.dwHighDateTime<<32)+t.dwLowDateTime for t in times[2:])/10000}
          debugger_env=dict(os.environ,PYTHONHOME=sys.base_prefix,PYTHONPATH=os.environ['LLGO_WINDOWS_LLDB_PYTHONPATH'])
          debugger_env['PATH']=sys.base_prefix+os.pathsep+debugger_env['PATH']
          lldb=os.environ['LLGO_LLDB']
          smoke=subprocess.run([lldb,'--version'],env=debugger_env,text=True,capture_output=True)
          print('debugger',lldb,smoke.returncode,smoke.stdout,smoke.stderr,flush=True)
          assert smoke.returncode==0
          cases=[line.strip()for line in pathlib.Path('dev/simd/upstream-archsimd-amd64.txt').read_text().splitlines()if line.strip()and not line.startswith('#')]
          qualified='^('+'|'.join(cases)+')$'
          result={'frozenBuildRun':43803237857 if os.environ['DIAG_LABEL']=='base'else None,'binarySHA256':hashlib.sha256(binary.read_bytes()).hexdigest(),'revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'runs':[]}
          for label,settings,pattern,expected,limit in [
              ('gogc-10',{'GOGC':'10'},'^TestAdd$',['TestAdd'],30),
              ('default',{'GOGC':'100'},'^TestAdd$',['TestAdd'],30),
              ('gogc-off',{'GOGC':'off'},'^TestAdd$',['TestAdd'],30),
              ('qualified',{'GOGC':'100','GC_PRINT_STATS':'1'},qualified,cases,90),
          ]:
              env=dict(os.environ)
              env.pop('GC_DONT_GC',None)
              env.pop('GOGC',None)
              env.update(settings)
              with (out/(label+'.stdout')).open('w')as stdout,(out/(label+'.stderr')).open('w')as stderr:
                  started=time.monotonic()
                  p=subprocess.Popen([str(binary),'-test.v','-test.count=1','-test.timeout='+('60s'if label=='qualified'else'20s'),'-test.run='+pattern],stdout=stdout,stderr=stderr,env=env)
                  stalled=False
                  samples=[]
                  while p.poll() is None and time.monotonic()-started<limit:
                      samples.append(sample(p))
                      time.sleep(0.25)
                  if p.poll() is None:
                      stalled=True
                      dbghelp=ctypes.WinDLL('Dbghelp')
                      dbghelp.MiniDumpWriteDump.argtypes=[wintypes.HANDLE,wintypes.DWORD,wintypes.HANDLE,wintypes.DWORD,ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p]
                      import msvcrt
                      with (out/(label+'.dmp')).open('wb')as dump:
                          ok=dbghelp.MiniDumpWriteDump(wintypes.HANDLE(int(p._handle)),p.pid,wintypes.HANDLE(msvcrt.get_osfhandle(dump.fileno())),0x1000,None,None,None)
                          print('minidump',label,bool(ok),flush=True)
                      if lldb:
                          variables='target variable -r llgo_gc_.*|GC_free_space_divisor|min_bytes_allocd_minimum'
                          cmd=[lldb,'--batch','-p',str(p.pid),'-o','thread backtrace all','-o',variables,'-o','process detach','-k','thread backtrace all','-k',variables,'-k','process detach']
                          try:
                              stack=subprocess.run(cmd,env=debugger_env,text=True,capture_output=True,timeout=30)
                              (out/(label+'.stacks')).write_text('debugger exit '+str(stack.returncode)+'\n'+stack.stdout+stack.stderr)
                          except subprocess.TimeoutExpired as e:
                              (out/(label+'.stacks')).write_text('debugger timeout\n'+str(e))
                      if p.poll() is None: p.kill()
                      p.wait(timeout=10)
                  output=(out/(label+'.stdout')).read_text()
                  result['runs'].append({'label':label,'environment':settings,'exit':p.returncode,'stalled':stalled,'seconds':time.monotonic()-started,'samples':samples,'expectedTests':expected,'executed':all('=== RUN   '+name+'\n'in output for name in expected)})
                  (out/'results.json').write_text(json.dumps(result,indent=2)+'\n')
                  print({k:v for k,v in result['runs'][-1].items()if k!='samples'},flush=True)
          assert all(r['exit']==0 and r['executed']for r in result['runs']if r['label']!='gogc-off')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llgo-msvc-simd-${{ matrix.label }}
          path: simd-diagnostic/
          if-no-files-found: error
          retention-days: 30
