        with:
          llgo-version: 56fa9aedc957cf3c9656c1a70f82c5424ab3b1c5
          install-method: source
          go-version: '1.27.3'
          llvm-version: '22'
          install-dependencies: false
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
